name: Micronaut CI Build

on:
  push:
    branches:
      - master

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: mn_playground
          MYSQL_USER: root
          MYSQL_PASSWORD: 0624
          MYSQL_ROOT_PASSWORD: 0624
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h mysql -u testuser -ptestpassword"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}
      - name: Grant execute permission for Gradle
        run: chmod +x gradlew
      - name: Run tests
        env:
          DATASOURCES_DEFAULT_URL: jdbc:mysql://127.0.0.1:3306/mn_playground
          DATASOURCES_DEFAULT_USERNAME: root
          DATASOURCES_DEFAULT_PASSWORD: 0624
        run: ./gradlew test
      - name: Build JAR
        run: ./gradlew build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: build/libs/*.jar
